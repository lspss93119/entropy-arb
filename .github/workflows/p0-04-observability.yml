name: P0-04 observability regression
on:
  push:
    branches: [feature/p0-04-fill-observability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q entropy_arb tests
      - run: python -m pytest -q tests/
