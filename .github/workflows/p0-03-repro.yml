name: P0-03 offline fault reproductions
on:
  push:
    branches:
      - research/p0-03-fault-repro
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/
