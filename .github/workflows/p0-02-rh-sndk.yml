name: P0-02 RH SNDK readonly probe
on:
  push:
    branches:
      - feature/p0-02-quote-freshness
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rh-sndk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public WebSocket client
        run: python -m pip install "websockets>=12,<18"
      - name: Compile probe
        run: python -m py_compile tools/probe_rh_sndk.py
      - name: Public RH SNDK timestamp observation (no secrets)
        run: python tools/probe_rh_sndk.py
