name: P0 read-only research tools
on:
  push:
    branches: [research/p0-live-readonly-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q entropy_arb tools tests
      - run: python -m pytest -q tests/
      - run: python tools/bench_presend_marker.py --iterations 50
