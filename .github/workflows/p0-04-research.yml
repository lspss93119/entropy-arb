name: P0-04 offline attribution checks
on:
  push:
    branches: [research/p0-04-fill-attribution]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/
      - run: python -m pytest -s -q tests/test_p004_attribution_research.py
